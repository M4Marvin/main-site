<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" width="880" height="140" role="img" aria-labelledby="sirius-title">
  <title id="sirius-title">Signal flow: TradingView webhooks and proprietary signals through the ingestor to 50 execution systems and the monitoring dashboard</title>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5 1.8 L10.5 6 L1.5 10.2 z" fill="#71717a"/>
    </marker>
  </defs>

  <g fill="none" stroke="#3f3f46" stroke-width="1">
    <rect x="8" y="20" width="188" height="100" rx="4"/>
    <rect x="232" y="20" width="188" height="100" rx="4"/>
    <rect x="456" y="20" width="188" height="100" rx="4"/>
    <rect x="680" y="20" width="188" height="100" rx="4"/>
  </g>

  <g fill="none" stroke="#71717a" stroke-width="1.25" stroke-linecap="round">
    <line x1="196" y1="70" x2="224" y2="70" marker-end="url(#arrow)"/>
    <line x1="420" y1="70" x2="448" y2="70" marker-end="url(#arrow)"/>
    <line x1="644" y1="70" x2="672" y2="70" marker-end="url(#arrow)"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <text x="102" y="68" fill="#fafafa" font-size="15" font-weight="500">
      <tspan x="102" dy="-0.6em">TradingView</tspan>
      <tspan x="102" dy="1.25em">webhooks</tspan>
    </text>

    <text x="326" y="64" fill="#fafafa" font-size="15" font-weight="500">Ingestor</text>
    <text x="326" y="86" fill="#71717a" font-size="11">auth · validate · route</text>

    <text x="550" y="68" fill="#fafafa" font-size="15" font-weight="500">
      <tspan x="550" dy="-0.6em">50 execution</tspan>
      <tspan x="550" dy="1.25em">systems</tspan>
    </text>

    <text x="774" y="64" fill="#fafafa" font-size="15" font-weight="500">Dashboard</text>
    <text x="774" y="86" fill="#71717a" font-size="11">monitoring</text>
  </g>
</svg>
