<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" role="img" aria-labelledby="sirius-title">
  <title id="sirius-title">Signal flow: TradingView webhooks and proprietary signals through the ingestor to 50 execution systems and the monitoring dashboard</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="410" fill="#000000"/>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <rect x="20" y="150" width="170" height="110" rx="10" fill="#ffffff08" stroke="url(#accent)" stroke-width="1.5"/>
    <text x="105" y="196" font-size="26" font-weight="600" fill="#e4e4e7">TradingView</text>
    <text x="105" y="226" font-size="26" font-weight="600" fill="#e4e4e7">webhooks</text>

    <rect x="210" y="150" width="190" height="110" rx="10" fill="#ffffff08" stroke="url(#accent)" stroke-width="1.5"/>
    <text x="305" y="192" font-size="26" font-weight="600" fill="#e4e4e7">Ingestor</text>
    <text x="305" y="222" font-size="15" fill="#a1a1aa">auth · validate · route</text>

    <rect x="420" y="150" width="170" height="110" rx="10" fill="#ffffff08" stroke="url(#accent)" stroke-width="1.5"/>
    <text x="505" y="196" font-size="26" font-weight="600" fill="#e4e4e7">50 execution</text>
    <text x="505" y="226" font-size="26" font-weight="600" fill="#e4e4e7">systems</text>

    <rect x="610" y="150" width="170" height="110" rx="10" fill="#ffffff08" stroke="url(#accent)" stroke-width="1.5"/>
    <text x="695" y="196" font-size="26" font-weight="600" fill="#e4e4e7">Dashboard</text>
    <text x="695" y="226" font-size="15" fill="#a1a1aa">monitoring</text>
  </g>
  <g stroke="url(#accent)" stroke-width="2.5">
    <line x1="194" y1="205" x2="204" y2="205"/>
    <polygon points="212,205 202,198 202,212" fill="#8b5cf6"/>
    <line x1="404" y1="205" x2="414" y2="205"/>
    <polygon points="422,205 412,198 412,212" fill="#8b5cf6"/>
    <line x1="594" y1="205" x2="604" y2="205"/>
    <polygon points="612,205 602,198 602,212" fill="#8b5cf6"/>
  </g>
</svg>