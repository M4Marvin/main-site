<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="sirius-title">
  <title id="sirius-title">Signal flow: TradingView webhooks and proprietary signals through the ingestor to 50 execution systems and the monitoring dashboard</title>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <symbol id="node" viewBox="0 0 198 172">
      <rect width="198" height="172" rx="16" fill="url(#border)"/>
      <rect x="2" y="2" width="194" height="168" rx="14" fill="#09090b"/>
    </symbol>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5 1.8 L10.5 6 L1.5 10.2 z" fill="#818cf8"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#000000"/>

  <use href="#node" x="36" y="154" width="198" height="172"/>
  <use href="#node" x="266" y="154" width="198" height="172"/>
  <use href="#node" x="496" y="154" width="198" height="172"/>
  <use href="#node" x="726" y="154" width="198" height="172"/>

  <g fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round">
    <line x1="242" y1="240" x2="258" y2="240" marker-end="url(#arrow)"/>
    <line x1="472" y1="240" x2="488" y2="240" marker-end="url(#arrow)"/>
    <line x1="702" y1="240" x2="718" y2="240" marker-end="url(#arrow)"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">
    <text x="135" y="240" fill="#f4f4f5" font-size="22" font-weight="600">
      <tspan x="135" dy="-0.72em">TradingView</tspan>
      <tspan x="135" dy="1.28em">webhooks</tspan>
    </text>

    <text x="365" y="228" fill="#f4f4f5" font-size="22" font-weight="600">Ingestor</text>
    <text x="365" y="256" fill="#a1a1aa" font-size="13">auth · validate · route</text>

    <text x="595" y="240" fill="#f4f4f5" font-size="22" font-weight="600">
      <tspan x="595" dy="-0.72em">50 execution</tspan>
      <tspan x="595" dy="1.28em">systems</tspan>
    </text>

    <text x="825" y="228" fill="#f4f4f5" font-size="22" font-weight="600">Dashboard</text>
    <text x="825" y="256" fill="#a1a1aa" font-size="13">monitoring</text>
  </g>
</svg>
