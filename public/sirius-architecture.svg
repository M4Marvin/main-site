<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="sirius-title">
  <title id="sirius-title">Signal flow: TradingView webhooks and proprietary signals through the ingestor to 50 execution systems and the monitoring dashboard</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="#000000"/>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#d4d4d8" text-anchor="middle">
    <rect x="20" y="160" width="160" height="80" rx="8" fill="#ffffff08" stroke="url(#accent)" stroke-width="1"/>
    <text x="100" y="188">TradingView webhooks</text>
    <text x="100" y="206">+ proprietary signals</text>

    <rect x="216" y="160" width="160" height="80" rx="8" fill="#ffffff08" stroke="url(#accent)" stroke-width="1"/>
    <text x="296" y="188">Ingestor</text>
    <text x="296" y="206">(auth · validate · route)</text>

    <rect x="412" y="160" width="160" height="80" rx="8" fill="#ffffff08" stroke="url(#accent)" stroke-width="1"/>
    <text x="492" y="188">50 execution systems</text>
    <text x="492" y="206">× separate accounts</text>

    <rect x="608" y="160" width="172" height="80" rx="8" fill="#ffffff08" stroke="url(#accent)" stroke-width="1"/>
    <text x="694" y="188">Dashboard</text>
    <text x="694" y="206">monitoring &amp; reports</text>
  </g>
  <g stroke="url(#accent)" stroke-width="1.5">
    <line x1="184" y1="200" x2="206" y2="200"/>
    <polygon points="212,200 205,195.5 205,204.5" fill="#8b5cf6"/>
    <line x1="380" y1="200" x2="402" y2="200"/>
    <polygon points="408,200 401,195.5 401,204.5" fill="#8b5cf6"/>
    <line x1="576" y1="200" x2="598" y2="200"/>
    <polygon points="604,200 597,195.5 597,204.5" fill="#8b5cf6"/>
  </g>
</svg>